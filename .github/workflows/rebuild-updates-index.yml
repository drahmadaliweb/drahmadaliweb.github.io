name: Rebuild updates index

on:
  push:
    branches: [main]
    paths:
      - 'updates/**'
      - 'scripts/build-updates-index.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build updates index
        run: node scripts/build-updates-index.mjs

      - name: Commit updated index when needed
        run: |
          if git diff --quiet -- updates-manifest.js; then
            echo "Updates index is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates-manifest.js
          git commit -m "Update site updates index"
          git push
