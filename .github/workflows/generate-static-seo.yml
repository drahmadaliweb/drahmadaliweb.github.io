name: Generate static SEO detail pages

on:
  push:
    branches: [main]
    paths:
      - "books/*.mjs"
      - "posts/*.mjs"
      - "articles/*.mjs"
      - "books-manifest.js"
      - "posts-manifest.js"
      - "selected-articles-manifest.js"
      - "book.html"
      - "bn/book.html"
      - "article.html"
      - "bn/article.html"
      - "post.html"
      - "bn/post.html"
      - "tools/generate_static_seo.py"
      - "tools/prerender_static_content.py"
      - "bn/publications.html"
      - "publications.html"
      - "bn/books.html"
      - "books.html"
      - "bn/index.html"
      - "index.html"
      - "updates-manifest.js"
      - "publications-manifest.js"
      - "updates/*.mjs"
      - "publications/*.mjs"

permissions:
  contents: write

concurrency:
  group: generate-static-seo
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --rebase origin main

      - name: Generate static detail pages and prerender archives
        run: |
          python3 tools/generate_static_seo.py
          python3 tools/prerender_static_content.py

      - name: Commit generated pages
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml books articles writings bn/books bn/articles bn/writings index.html bn/index.html books.html bn/books.html publications.html bn/publications.html
          if git diff --cached --quiet; then
            echo "Generated pages already up to date."
            exit 0
          fi
          git commit -m "Generate static SEO detail pages"
          git push origin main
