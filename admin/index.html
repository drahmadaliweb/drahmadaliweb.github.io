<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Website Content Manager | Dr. Ahmad Ali</title><link rel="stylesheet" href="admin.css"></head><body>
<div class="admin-shell"><header><div><strong>Dr. Ahmad Ali</strong><span>Website Content Manager</span></div><div class="head-actions"><button id="langBtn" type="button">EN / বাংলা</button><button id="logoutBtn" type="button" hidden>Log out</button></div></header>
<main><section id="loginPanel" class="card login-card"><h1>অ্যাডমিন লগইন</h1><p>ওয়েবসাইটের বই, পোস্ট, প্রবন্ধ, প্রকাশনা ও আপডেট পরিচালনা করুন।</p><form id="loginForm"><label>Email<input name="email" type="email" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button class="primary" type="submit">লগইন</button><p id="loginMsg" class="msg"></p></form></section>
<section id="appPanel" hidden><div class="admin-grid"><aside class="card"><h2>Content</h2><nav id="typeNav"><button data-type="book">Books / বই</button><button data-type="post">Posts / পোস্ট</button><button data-type="article">Selected Articles / প্রবন্ধ</button><button data-type="publication">Publications / প্রকাশনা</button><button data-type="update">Updates / আপডেট</button></nav><p class="small">This page is intentionally not linked from the public website.</p></aside>
<section class="card content-panel"><div class="toolbar"><div><h1 id="sectionTitle">Books</h1><p id="adminIdentity" class="small"></p></div><div><input id="listSearch" type="search" placeholder="Search"><button id="addBtn" class="primary" type="button">+ Add new</button></div></div><div id="contentList" class="content-list"></div></section>
<section id="editorPanel" class="card editor-panel" hidden><div class="editor-head"><div><h2 id="editorTitle">Edit</h2><p class="small">Fields marked * are required.</p></div><button id="closeEditor" type="button">Close</button></div><form id="contentForm"></form><p id="saveMsg" class="msg"></p></section></div></section></main></div>
<script src="../reviews-config.js"></script><script src="../topic-taxonomy.js"></script><script src="../books-manifest.js"></script><script src="../posts-manifest.js"></script><script src="../selected-articles-manifest.js"></script><script src="../publications-manifest.js"></script><script src="../updates-manifest.js"></script><script src="admin.js"></script></body></html>
